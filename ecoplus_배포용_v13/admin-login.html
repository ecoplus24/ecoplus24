<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 로그인 | (주)에코플러스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1e35;--navy2:#0a1828;--navy3:#162b48;
  --gold:#c4580a;--gold2:#d4680e;--goldL:#fdf0e6;
  --red:#c0392b;
  --white:#fff;--text:#141414;--muted:#6b7280;--border:#e0dbd3;
}
body{font-family:"Noto Sans KR",sans-serif;background:linear-gradient(135deg,var(--navy3) 0%,var(--navy2) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.login-box{background:#fff;border-radius:18px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:36px}
.logo-mark{width:64px;height:64px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);padding:4px;margin-bottom:16px}
.logo-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:900;color:var(--navy);margin-bottom:6px}
.brand-sub{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700}

h1{font-size:24px;font-weight:900;color:var(--navy);margin-bottom:8px;text-align:center;font-family:"Noto Serif KR",serif}
.desc{font-size:13px;color:var(--muted);text-align:center;margin-bottom:32px;line-height:1.6}

.first-login-notice{background:#fff7eb;border:1px solid var(--gold);border-radius:10px;padding:14px 16px;margin-bottom:24px;font-size:12.5px;color:#5a3008;line-height:1.6;display:none}
.first-login-notice.show{display:block}
.first-login-notice strong{display:block;font-weight:900;color:var(--gold);margin-bottom:4px}

.field{margin-bottom:20px}
label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;letter-spacing:.5px}
input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;transition:border-color .2s}
input:focus{outline:none;border-color:var(--gold)}

.btn{width:100%;padding:16px;background:var(--gold);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .2s}
.btn:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(196,88,10,.3)}

.error{background:#fdeaea;color:var(--red);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.error.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.back{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
.back a{color:var(--gold);text-decoration:none;font-weight:700}

.security-note{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.security-note strong{color:var(--navy)}
</style>
</head>
<body>

<div class="login-box">
  <div class="brand">
    <div class="logo-mark"><img src="ecoplus_logo.png" alt="에코플러스"></div>
    <div class="brand-name">에코플러스</div>
    <div class="brand-sub">ADMIN CONSOLE</div>
  </div>

  <h1>관리자 로그인</h1>
  <p class="desc">신청서 관리 시스템에 접속하려면<br>관리자 비밀번호를 입력해주세요.</p>

  <div class="first-login-notice" id="firstLoginNotice">
    <strong>🔑 첫 사용 안내</strong>
    초기 비밀번호 <code style="background:#fff;padding:1px 6px;border-radius:3px;font-family:monospace">ecoplus2026!</code> 로 로그인하시면, 즉시 새 비밀번호로 변경하실 수 있습니다.
  </div>

  <div class="error" id="errorMsg">비밀번호가 일치하지 않습니다.</div>

  <form onsubmit="login(event)">
    <div class="field">
      <label>관리자 비밀번호</label>
      <input type="password" id="pwInput" placeholder="비밀번호 입력" autofocus required>
    </div>
    <button type="submit" class="btn">로그인 →</button>
  </form>

  <div class="back">
    <a href="index.html">← 메인 사이트로 돌아가기</a>
  </div>

  <div class="security-note">
    🔒 <strong>보안 안내</strong><br>
    이 페이지는 검색엔진에 노출되지 않으며,<br>
    관리자 권한이 있는 본인만 접근하세요.
  </div>
</div>

<script>
// ════════════════════════════════════════════
// 초기 기본 비밀번호 (한 번도 변경 안 한 경우에만 사용됨)
// ════════════════════════════════════════════
const DEFAULT_PASSWORD = 'ecoplus2026!';

// 첫 로그인 안내 표시 여부
if (!localStorage.getItem('ecoplus_pw_hash')) {
  document.getElementById('firstLoginNotice').classList.add('show');
}

// ════════════════════════════════════════════
// SHA-256 해시 함수 (Web Crypto API 사용)
// ════════════════════════════════════════════
async function sha256(text) {
  const buffer = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ════════════════════════════════════════════
// 로그인 처리
// ════════════════════════════════════════════
async function login(e) {
  e.preventDefault();
  const input = document.getElementById('pwInput').value;
  const errEl = document.getElementById('errorMsg');
  
  let isMatch = false;
  
  // 저장된 해시가 있으면 그것과 비교, 없으면 기본 비밀번호와 비교
  const savedHash = localStorage.getItem('ecoplus_pw_hash');
  
  if (savedHash) {
    // 사용자가 비밀번호를 한 번이라도 변경한 적이 있음 → 해시 비교
    const inputHash = await sha256(input);
    isMatch = (inputHash === savedHash);
  } else {
    // 변경한 적 없음 → 기본 비밀번호로 비교
    isMatch = (input === DEFAULT_PASSWORD);
  }
  
  if (isMatch) {
    sessionStorage.setItem('ecoplus_admin', 'authenticated');
    sessionStorage.setItem('ecoplus_login_time', new Date().toISOString());
    
    // 기본 비밀번호로 로그인했고 아직 변경 안 한 경우 플래그 설정
    if (!savedHash) {
      sessionStorage.setItem('ecoplus_first_login', 'true');
    }
    
    window.location.href = 'admin.html';
  } else {
    errEl.classList.add('show');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    setTimeout(() => errEl.classList.remove('show'), 3000);
  }
}

// 이미 로그인된 상태면 대시보드로 바로 이동
if (sessionStorage.getItem('ecoplus_admin') === 'authenticated') {
  window.location.href = 'admin.html';
}
</script>

</body>
</html>
