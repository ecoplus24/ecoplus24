<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 | 에코플러스 경영컨설팅</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css"><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#14432A;--gold:#B0863B;--red:#B23B3B;--redl:#fff0ee;--bg:#F5F4EC;--text:#16241C;--muted:#4B5A50;--border:#E0DECF}
body{background:var(--bg);font-family:"Pretendard",sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.7}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card{background:#fff;max-width:520px;width:100%;border-radius:16px;padding:48px 40px;text-align:center;box-shadow:0 24px 60px rgba(13,30,53,.12);animation:fadeUp .5s ease}
.x-icon{width:88px;height:88px;border-radius:50%;background:var(--redl);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:shake .5s ease}
.x-icon svg{width:44px;height:44px;color:var(--red)}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:10px}
h1{font-family:"Gowun Batang",serif;font-size:30px;font-weight:900;color:var(--navy);margin-bottom:14px;letter-spacing:-1px}
.lead{font-size:16px;color:var(--muted);line-height:1.9;margin-bottom:24px}
.err-box{background:var(--redl);border-left:3px solid var(--red);padding:16px 20px;border-radius:6px;margin-bottom:28px;text-align:left;font-size:14px;color:var(--red);font-weight:600}
.err-box strong{display:block;font-weight:900;margin-bottom:4px}
.btn-grid{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;transition:all .2s}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:hover{background:#977231}
.btn-ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}
.contact{margin-top:24px;font-size:13px;color:var(--muted)}
</style>

<!-- ═══ Google Analytics 4 ═══ (G-XXXXXXXXXX 를 실제 측정 ID로 교체) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX', { anonymize_ip: true });
</script>
</head>
<body>
<div class="card">
  <div class="x-icon">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
  </div>
  <div class="eyebrow">PAYMENT FAILED</div>
  <h1>결제에 실패했습니다</h1>
  <p class="lead">결제가 정상적으로 완료되지 않았습니다.<br>아래 사유를 확인하시고 다시 시도해주세요.</p>

  <div class="err-box">
    <strong id="errCode">오류 코드: -</strong>
    <span id="errMsg">알 수 없는 오류가 발생했습니다</span>
  </div>

  <div class="btn-grid">
    <a href="index.html" class="btn btn-ghost">홈으로</a>
    <a href="javascript:history.back()" class="btn btn-primary">다시 시도</a>
  </div>

  <p class="contact">
    문제가 지속되면: <strong>010-0000-0000</strong>로 연락주세요
  </p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code') || 'UNKNOWN';
const message = params.get('message') || '알 수 없는 오류가 발생했습니다';

document.getElementById('errCode').textContent = '오류 코드: ' + code;
document.getElementById('errMsg').textContent = message;
</script>

<!-- ═══ 에코플러스 통합 트래커 ═══ -->
<script>
  window.ECO_TRACK_CONFIG = {
    gasUrl: 'https://script.google.com/macros/s/AKfycbzmeIEQaAZAYt1njCVs4BzdGCQdyMC4Q8I_9VCjxEAYpEqCxZpPT7YDcYqQuL8KUQMJ/exec',   /* Apps Script 배포 후 /exec URL로 교체 */
    site: 'ecoplus100',
    crossDomains: ['ecofree.cloud']
  };
</script>
<script src="eco-track.js"></script>
</body>
</html>
