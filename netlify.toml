# ════════════════════════════════════
# Netlify 배포 설정 파일
# ════════════════════════════════════

[build]
  # 정적 사이트라서 빌드 명령 없음
  publish = "."
  functions = "netlify/functions"

# ── 보안 헤더 ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── 캐시 설정 (이미지는 1년, HTML은 1시간) ──
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 관리자 페이지: 검색엔진 차단 + 캐시 비활성화 ──
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

# ── 함수 리다이렉트 ──
[[redirects]]
  from = "/api/confirm-payment"
  to = "/.netlify/functions/confirm-payment"
  status = 200

# ── 무료 자가진단 (ecofree.cloud) 바로가기 ──
#    전단지·명함·QR에 ecoplus100.com/진단 처럼 짧게 적을 수 있게 하는 용도
[[redirects]]
  from = "/진단"
  to = "https://ecofree.cloud/"
  status = 301
  force = true

[[redirects]]
  from = "/diagnosis"
  to = "https://ecofree.cloud/"
  status = 301
  force = true
